[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "response-style"
version = "0.1.0"
description = "Mine private response-style examples from local coding-agent conversations"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Onur Solmaz" }]
dependencies = []

[project.scripts]
response-style = "response_style.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/response_style"]

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "mutmut>=3.3,<4",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<0.13",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C90", "ANN", "RUF", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/response_style"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mutmut]
source_paths = ["src/response_style/text.py"]
also_copy = [
    "src/response_style/__init__.py",
    "src/response_style/adapters.py",
    "src/response_style/cli.py",
    "src/response_style/dataset.py",
    "src/response_style/miner.py",
    "src/response_style/model.py",
    "src/response_style/py.typed",
]
pytest_add_cli_args_test_selection = ["tests/"]
