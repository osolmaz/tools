python:
  coverage:
    threshold: 85
    paths:
      - src
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - src/response_style
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - src/response_style/text.py
  dependency_boundaries:
    - from: src/response_style/cli
      allow:
        - src/response_style/adapters
        - src/response_style/dataset
        - src/response_style/miner
        - src/response_style/model
    - from: src/response_style/adapters
      allow:
        - src/response_style/model
        - src/response_style/text
    - from: src/response_style/dataset
      allow:
        - src/response_style/model
    - from: src/response_style/miner
      allow:
        - src/response_style/model
        - src/response_style/text
    - from: src/response_style/model
      allow: []
    - from: src/response_style/text
      allow: []
