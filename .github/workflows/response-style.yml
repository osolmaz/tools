name: Response Style

on:
  pull_request:
    paths:
      - ".github/workflows/response-style.yml"
      - "docs/2026-08-07-response-style-private-plan.md"
      - "response-style/**"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/response-style.yml"
      - "docs/2026-08-07-response-style-private-plan.md"
      - "response-style/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: response-style
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov=response_style --cov-fail-under=85
      - run: uv run pip-audit
      - run: uv run python scripts/check-mutation.py --min-kill-rate 95
      - name: Stage monorepo CI evidence for Slophammer
        run: |
          mkdir -p .github/workflows
          cp ../.github/workflows/response-style.yml .github/workflows/response-style.yml
      - run: uvx slophammer-py@0.4.0 dry .
      - run: uvx slophammer-py@0.4.0 check . --execute
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npx -y @simpledoc/simpledoc check
        working-directory: .
